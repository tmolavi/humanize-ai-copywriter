[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanize-ai-copywriter"
version = "1.0.0"
description = "Universal Agent Skill & CLI for Zero-Entropy, Undetectable Human Copywriting, High-Conversion Sales & SEO/GEO Citations"
readme = "README.md"
authors = [
    { name = "Taghi Molavi", email = "contact@molavi.pro" }
]
license = { text = "MIT" }
keywords = [
    "humanize-ai",
    "ai-humanizer",
    "undetectable-ai",
    "copywriting",
    "geo",
    "aeo",
    "seo",
    "zero-entropy",
    "conversion-copywriting",
    "agent-skills",
    "antigravity",
    "claude-code",
    "cursor",
    "ai-slop-remover",
    "stealth-writer"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Marketing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
humanize-ai-copywriter = "humanize_ai_copywriter.cli:main"

[project.urls]
Homepage = "https://molavi.pro"
Repository = "https://github.com/tmolavi/humanize-ai-copywriter"
Documentation = "https://github.com/tmolavi/humanize-ai-copywriter#readme"
Tracker = "https://github.com/tmolavi/humanize-ai-copywriter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["humanize_ai_copywriter*"]
